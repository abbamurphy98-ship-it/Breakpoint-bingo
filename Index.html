<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solana Breakpoint Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#080808;--purple:#9945FF;--green:#14F195;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.14);--dim:rgba(255,255,255,.64);--grad:linear-gradient(45deg,#9945FF,#14F195);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 90% -5%,rgba(153,69,255,.38),transparent 70%),radial-gradient(50% 40% at 0% 105%,rgba(20,241,149,.2),transparent 70%)}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:22px 20px 48px}
.hero img{display:block;width:100%;height:auto;border-radius:16px}
h1{display:flex;align-items:center;gap:.26em;font:800 clamp(3.2rem,17vw,5.6rem)/1 Unbounded,sans-serif;letter-spacing:-.02em;margin:26px 0 12px}
.mark{height:.74em;width:auto;flex:none}
.tag{font-size:1.1rem;color:var(--dim);margin:0 0 26px}
.meter{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.segs{display:flex;gap:4px;flex:1}
.segs i{flex:1;height:10px;transform:skewX(-16deg);background:var(--glass);border:1px solid var(--line);transition:background .4s,box-shadow .4s}
.segs i.on{background:var(--grad);border-color:transparent;box-shadow:0 0 14px rgba(20,241,149,.45)}
.count{font-family:Unbounded,sans-serif;font-weight:500;font-size:1rem;white-space:nowrap}
.count b{color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 4px}
.tile{--s:-16deg;position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--glass);color:#fff;font:600 clamp(.8rem,3.4vw,1rem)/1.25 Manrope,sans-serif;text-align:left;padding:12px;display:flex;align-items:flex-end;cursor:pointer;overflow:hidden;isolation:isolate;-webkit-tap-highlight-color:transparent;transform:skewX(var(--s));transition:border-color .25s,transform .15s}
.tile:nth-child(n+4):nth-child(-n+6){--s:16deg}
.tile:nth-child(3n+1){--px:0%}.tile:nth-child(3n+2){--px:50%}.tile:nth-child(3n){--px:100%}
.tile:nth-child(-n+3){--py:0%}.tile:nth-child(n+4):nth-child(-n+6){--py:50%}.tile:nth-child(n+7){--py:100%}
.tile>*{transform:skewX(calc(var(--s) * -1))}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--grad);background-size:300% 300%;background-position:var(--px) var(--py);transform:translateX(-101%);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.tile:hover{border-color:rgba(153,69,255,.9)}
.tile:active{transform:skewX(var(--s)) scale(.96)}
.tile:focus-visible,.btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.tile svg{position:absolute;top:10px;right:12px;width:18px;height:18px;opacity:.55;transition:opacity .3s}
.tile .open{display:none}
.tile.on{color:#080808;border-color:transparent;font-weight:800}
.tile.on::before{transform:translateX(0)}
.tile.on svg{opacity:1}
.tile.on .shut{display:none}
.tile.on .open{display:block}
.tile.line{box-shadow:0 0 0 2px #fff,0 0 26px rgba(20,241,149,.55)}
.own{margin-top:16px}
.ownrow{display:flex;gap:8px}
.ownrow input{flex:1;min-width:0;font:600 .95rem Manrope,sans-serif;background:var(--glass);border:1px solid var(--line);border-radius:999px;color:#fff;padding:13px 18px}
.ownrow input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.ownTile{width:100%;text-align:left;padding:16px 18px;border-radius:12px;border:1px dashed rgba(20,241,149,.6);background:var(--glass);color:#fff;font:700 1rem/1.25 Manrope,sans-serif;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;transition:background .3s}
.ownTile:focus-visible,.ownEdit:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.ownTile.on{background:var(--grad);color:#080808;border:1px solid transparent}
.ownEdit{background:none;border:0;color:var(--dim);font:600 .85rem Manrope,sans-serif;text-decoration:underline;cursor:pointer;margin-top:8px;padding:4px 0}
.status{min-height:3.2em;margin:22px 0 6px}
.rank{font-family:Unbounded,sans-serif;font-weight:500;font-size:1.15rem;margin:0 0 4px}
.sub{margin:0;color:var(--dim);font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{font:800 .95rem Manrope,sans-serif;border-radius:999px;padding:14px 22px;border:1px solid var(--line);background:var(--glass);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,transform .15s}
.btn:hover{border-color:var(--purple)}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--grad);color:#080808;border-color:transparent;flex:1 1 180px;justify-content:center}
.btn.main[aria-disabled="true"]{opacity:.45;pointer-events:none}
.foot{margin-top:34px;font-size:.82rem;color:var(--dim)}
.modal{position:fixed;inset:0;z-index:10;background:rgba(8,8,8,.92);display:none;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px))}
.modal.show{display:block}
.modal .in{max-width:420px;margin:0 auto;text-align:center}
.modal img{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);display:block}
.modal p{color:var(--dim);font-size:.92rem;margin:14px 0}
.modal .actions{justify-content:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.tile::before,.tile,.segs i{transition:none}}
</style>
</head>

  <h1><svg class="mark" viewBox="0 0 110 90" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9945FF"/><stop offset="1" stop-color="#14F195"/></linearGradient></defs><g fill="url(#lg)" stroke="url(#lg)" stroke-width="3" stroke-linejoin="round"><polygon points="16,2 108,2 94,22 2,22"/><polygon points="2,34 94,34 108,54 16,54"/><polygon points="16,66 108,66 94,86 2,86"/></g></svg><span class="sr">Solana Breakpoint </span>BINGO</h1>

<script>
(function(){
var POOL=[
 "Stop at the Solflare booth","Meet a founder I follow","Rip IRL packs with Collector Crypt",
 "Sip a DSCVR beer","Snap with cardboard Nikkidey","Say hi to Toly",
 "Attend a hacker house","Join a group photo","Go to a side event I haven’t heard of"
];
var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var RANKS=[
 ["Just landed","Tap a square to start unlocking."],
 ["Just landed","One down. The badge is on."],
 ["Getting the badge","Keep going, the hall is filling up."],
 ["Getting the badge","Three unlocked. Look for a line."],
 ["Side event regular","Halfway there and still moving."],
 ["Side event regular","Five unlocked. You know the venue by now."],
 ["Main stage energy","Six unlocked. People know your name."],
 ["Main stage energy","Seven down. Two to go."],
 ["Breakpoint insider","Eight of nine. So close to a full unlock."],
 ["Full Breakpoint","Every square unlocked. You did it all."]
];
var KEY="sbb-card-v2";
var ids=[],done=[],own={t:"",d:false};
var grid=document.getElementById("grid"),segs=document.getElementById("segs");
var nEl=document.getElementById("n"),rankEl=document.getElementById("rank"),subEl=document.getElementById("sub"),share=document.getElementById("share");
var tiles=[],prevLines=0;

var LOCK='<svg class="shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var OPEN='<svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function save(){try{localStorage.setItem(KEY,JSON.stringify({ids:ids,done:done,own:own}))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ids&&s.ids.length===9&&s.done&&s.done.length===9){ids=s.ids;done=s.done;if(s.own&&typeof s.own.t==="string")own={t:s.own.t.slice(0,40),d:!!s.own.d};return true}}catch(e){}return false}
function deal(){
  ids=POOL.map(function(_,i){return i});done=ids.map(function(){return false});
}
function build(){
  grid.innerHTML="";tiles=[];
  ids.forEach(function(id,i){
    var b=document.createElement("button");
    b.type="button";b.className="tile";b.innerHTML=LOCK+OPEN+"<span>"+POOL[id]+"</span>";
    b.addEventListener("click",function(){done[i]=!done[i];save();update(true)});
    grid.appendChild(b);tiles.push(b);
  });
  segs.innerHTML="";for(var k=0;k<9;k++)segs.appendChild(document.createElement("i"));
  prevLines=lines().length;update(false);
}
function lines(){return LINES.filter(function(l){return l.every(function(i){return done[i]})})}
function renderOwn(){
  var has=!!own.t,t=document.getElementById("ownTile");
  document.getElementById("ownRow").hidden=has;t.hidden=!has;document.getElementById("ownEdit").hidden=!has;
  document.getElementById("ownTxt").textContent="Bonus: "+own.t;
  document.getElementById("ownMark").textContent=own.d?"Unlocked":"Locked";
  t.classList.toggle("on",!!own.d);t.setAttribute("aria-pressed",own.d?"true":"false");
}
function addOwn(){var v=document.getElementById("ownIn").value.trim().slice(0,40);if(!v)return;own={t:v,d:false};document.getElementById("ownIn").value="";save();update(false)}
document.getElementById("ownAdd").addEventListener("click",addOwn);
document.getElementById("ownIn").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addOwn()}});
document.getElementById("ownTile").addEventListener("click",function(){own.d=!own.d;save();update(false)});
document.getElementById("ownEdit").addEventListener("click",function(){var i=document.getElementById("ownIn");i.value=own.t;own={t:"",d:false};save();update(false);i.focus()});
function update(animate){renderOwn();
  var count=done.filter(Boolean).length,ls=lines(),inLine={};
  ls.forEach(function(l){l.forEach(function(i){inLine[i]=1})});
  tiles.forEach(function(t,i){
    t.classList.toggle("on",!!done[i]);t.classList.toggle("line",!!inLine[i]);
    t.setAttribute("aria-pressed",done[i]?"true":"false");
    t.setAttribute("aria-label",POOL[ids[i]]+(done[i]?", unlocked":", locked"));
  });
  Array.prototype.forEach.call(segs.children,function(s,i){s.classList.toggle("on",i<count)});
  nEl.textContent=count;
  var r=RANKS[count];rankEl.textContent=r[0];
  var extra=ls.length?(ls.length===1?"1 bingo line. ":ls.length+" bingo lines. "):"";
  subEl.textContent=extra+r[1];
  var text="I’m planning to unlock "+count+"/9 at Solana Breakpoint London"+(ls.length?" with "+ls.length+" bingo line"+(ls.length>1?"s":"")+" lined up":"")+". How much of Breakpoint will you unlock?\n\nSOLANA BREAKPOINT BINGO";
  if(own.t)text+="\n\nMy own add-on: "+own.t;share.href="https://twitter.com/intent/tweet?text="+encodeURIComponent(text);
  share.setAttribute("aria-disabled",count===0?"true":"false");
  if(animate&&(ls.length>prevLines||count===9))burst();
  prevLines=ls.length;
}
document.getElementById("reset").addEventListener("click",function(){done=done.map(function(){return false});own.d=false;save();update(false);prevLines=0});

var cv=document.getElementById("fx"),cx=cv.getContext("2d"),parts=[],raf=0;
var still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",size);size();
function burst(){
  if(still)return;
  var cols=["#9945FF","#14F195","#ffffff"],d=devicePixelRatio;
  for(var i=0;i<110;i++){
    var a=Math.random()*Math.PI*2,s=(4+Math.random()*9)*d;
    parts.push({x:cv.width/2,y:cv.height*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4*d,w:(5+Math.random()*7)*d,h:(3+Math.random()*4)*d,c:cols[i%3],l:1,r:Math.random()*6});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.l>0});
  parts.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.35*devicePixelRatio;p.vx*=.985;p.l-=.014;p.r+=.2;
    cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
  });
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function wrapLines(g,t,w){var ws=t.split(" "),out=[],cur="";ws.forEach(function(x){var tr=cur?cur+" "+x:x;if(g.measureText(tr).width>w&&cur){out.push(cur);cur=x}else cur=tr});out.push(cur);return out}
function mark(g,x,y,w){
  var h=w*.22,gap=w*.08,sl=w*.14,gr=g.createLinearGradient(x,y+3*h+2*gap,x+w,y);gr.addColorStop(0,"#9945FF");gr.addColorStop(1,"#14F195");g.fillStyle=gr;
  for(var i=0;i<3;i++){var yy=y+i*(h+gap);g.beginPath();
    if(i%2===0){g.moveTo(x+sl,yy);g.lineTo(x+w,yy);g.lineTo(x+w-sl,yy+h);g.lineTo(x,yy+h)}else{g.moveTo(x,yy);g.lineTo(x+w-sl,yy);g.lineTo(x+w,yy+h);g.lineTo(x+sl,yy+h)}
    g.closePath();g.fill()}
}
function drawCard(){
  var W=1080,H=1690,c=document.createElement("canvas");c.width=W;c.height=H;var g=c.getContext("2d");
  g.fillStyle="#080808";g.fillRect(0,0,W,H);
  var r=g.createRadialGradient(W,0,0,W,0,800);r.addColorStop(0,"rgba(153,69,255,.45)");r.addColorStop(1,"rgba(153,69,255,0)");g.fillStyle=r;g.fillRect(0,0,W,H);
  r=g.createRadialGradient(0,H,0,0,H,750);r.addColorStop(0,"rgba(20,241,149,.25)");r.addColorStop(1,"rgba(20,241,149,0)");g.fillStyle=r;g.fillRect(0,0,W,H);
  var im=document.getElementById("banner");
  if(im&&im.complete&&im.naturalWidth){g.save();rr(g,60,60,960,320,24);g.clip();g.drawImage(im,60,60,960,320);g.restore()}
  mark(g,60,430,110);
  g.fillStyle="#fff";g.font="800 100px Unbounded,Manrope,sans-serif";g.textBaseline="alphabetic";g.fillText("BINGO",200,520);
  g.fillStyle="rgba(255,255,255,.65)";g.font="600 30px Manrope,sans-serif";g.fillText("How much of Breakpoint will you unlock?",60,572);
  var ls=lines(),inLine={};ls.forEach(function(l){l.forEach(function(i){inLine[i]=1})});
  var t=Math.tan(16*Math.PI/180),X0=81,Y0=610,T=290,G=24;
  ids.forEach(function(id,i){
    var row=Math.floor(i/3),col=i%3,sk=row===1?t:-t,on=done[i];
    var cx=X0+col*(T+G)+T/2,cy=Y0+row*(T+G)+T/2,h=T/2;
    g.save();g.translate(cx,cy);g.transform(1,0,sk,1,0,0);
    rr(g,-h,-h,T,T,20);
    if(on){var tg=g.createLinearGradient(X0-cx,Y0+3*T+2*G-cy,X0+3*T+2*G-cx,Y0-cy);tg.addColorStop(0,"#9945FF");tg.addColorStop(1,"#14F195");g.fillStyle=tg}else g.fillStyle="rgba(255,255,255,.06)";
    g.fill();
    if(!on){g.lineWidth=2;g.strokeStyle="rgba(255,255,255,.2)";g.stroke()}
    if(inLine[i]){rr(g,-h,-h,T,T,20);g.lineWidth=6;g.strokeStyle="#fff";g.stroke()}
    g.transform(1,0,-sk,1,0,0);
    g.fillStyle=on?"#080808":"#fff";g.font="800 28px Manrope,sans-serif";
    var tl=wrapLines(g,POOL[id],T-50),ty=h-26-(tl.length-1)*34;
    tl.forEach(function(s,k){g.fillText(s,-h+24,ty+k*34)});
    g.lineWidth=5;g.lineCap="round";g.lineJoin="round";g.strokeStyle=on?"#080808":"rgba(255,255,255,.5)";
    if(on){g.beginPath();g.moveTo(h-42,-h+44);g.lineTo(h-26,-h+60);g.lineTo(h-8,-h+34);g.stroke()}
    else{rr(g,h-44,-h+40,28,22,5);g.lineWidth=4;g.stroke();g.beginPath();g.arc(h-30,-h+40,8,Math.PI,0);g.stroke()}
    g.restore();
  });
  if(own.t){g.fillStyle=own.d?"#14F195":"rgba(255,255,255,.8)";g.font="700 28px Manrope,sans-serif";g.fillText("Bonus: "+own.t+(own.d?"  \u2713":""),60,1574)}
  var cnt=done.filter(Boolean).length;
  g.fillStyle="#fff";g.font="800 36px Unbounded,Manrope,sans-serif";g.fillText(cnt+"/9 unlocked"+(ls.length?"  ·  "+ls.length+(ls.length>1?" bingos":" bingo"):""),60,1620);
  g.fillStyle="rgba(255,255,255,.65)";g.font="600 26px Manrope,sans-serif";g.fillText("Solana Breakpoint · London · 15–17 Nov",60,1662);
  return c;
}
var modal=document.getElementById("modal"),pic=document.getElementById("pic"),shImg=document.getElementById("shareimg"),blobNow=null;
document.getElementById("save").addEventListener("click",function(){
  var go=function(){
    var c=drawCard();pic.src=c.toDataURL("image/png");
    document.getElementById("share2").href=share.href;
    c.toBlob(function(b){blobNow=b;
      try{var f=new File([b],"breakpoint-bingo.png",{type:"image/png"});shImg.style.display=(navigator.canShare&&navigator.canShare({files:[f]}))?"":"none"}catch(e){shImg.style.display="none"}
    },"image/png");
    modal.classList.add("show");
  };
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);else go();
});
shImg.addEventListener("click",function(){
  if(!blobNow)return;
  try{navigator.share({files:[new File([blobNow],"breakpoint-bingo.png",{type:"image/png"})],text:"How much of Breakpoint will you unlock?"}).catch(function(){})}catch(e){}
});

addEventListener("keydown",function(e){if(e.key==="Escape")modal.classList.remove("show")});
